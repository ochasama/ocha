<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Umacha">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f0c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Umacha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f0c; --bg2:#141812; --card:#191e17; --card2:#21281e; --line:#2c3528;
  --tx:#f3f7ee; --tx2:#93a08b; --lime:#a6ff4d; --lime2:#1fbf6a; --red:#ff4d5e; --gold:#ffd23f;
  --grad:linear-gradient(135deg,#b6ff5c,#1fbf6a);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --disp:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-weight:500;font-size:16px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(600px 300px at 110% -5%, rgba(166,255,77,.16), transparent 70%),
  radial-gradient(500px 300px at -20% 30%, rgba(31,191,106,.10), transparent 70%), var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 110px)}
/* header */
header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
header .ava{width:52px;height:52px;border-radius:16px;background:var(--grad);flex-shrink:0;overflow:hidden;box-shadow:0 6px 20px rgba(166,255,77,.25)}
header .ava svg{width:100%;height:100%}
.brand{font-family:var(--disp);font-size:30px;letter-spacing:.01em;line-height:1}
.brand em{font-style:normal;color:var(--lime)}
.tagline{font-size:12px;color:var(--tx2);font-weight:700;letter-spacing:.12em;margin-top:4px}
h2{font-family:var(--disp);font-weight:400;font-size:26px;margin:26px 0 12px;line-height:1.05;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 .jp{font-size:14px;color:var(--lime);font-family:"Zen Kaku Gothic New";font-weight:900;letter-spacing:.1em}
h3{font-family:var(--disp);font-weight:400;font-size:18px;margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.sub{color:var(--tx2);font-size:13px;line-height:1.5}
/* form */
.field{margin-bottom:22px}
.label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.label b{font-family:var(--disp);font-weight:400;font-size:16px}
.label span{font-size:11px;color:var(--tx2);font-weight:700;letter-spacing:.12em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s;color:var(--tx)}
.chip .k{color:var(--tx2);font-size:11px;margin-left:5px;font-weight:700}
.chip.on{background:var(--lime);border-color:var(--lime);color:#0d0f0c;transform:rotate(-1.5deg)}
.chip.on .k{color:#2a4a12}
.chip:active{transform:scale(.92)}
input[type=text],input[type=number],textarea{width:100%;font:inherit;font-weight:700;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;background:var(--card2);color:var(--tx);outline:none}
input::placeholder,textarea::placeholder{color:#5d6857;font-weight:500}
input:focus,textarea:focus{border-color:var(--lime)}
textarea{min-height:66px;resize:vertical}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
/* uma-meter */
.meter{background:var(--card2);border-radius:20px;padding:14px 14px 18px;border:1.5px solid var(--line);position:relative;overflow:hidden}
.meter .top{display:flex;align-items:center;gap:14px}
.meter .war{width:86px;height:86px;flex-shrink:0;transition:transform .2s}
.meter .war.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.12) rotate(-4deg)}}
.meter .num{font-family:var(--disp);font-size:52px;line-height:1}
.meter .num small{font-size:20px;color:var(--tx2)}
.meter .shout{font-family:var(--disp);font-size:18px;color:var(--lime);margin-top:4px;min-height:22px}
.meter .who{font-size:12px;color:var(--tx2);font-weight:700;letter-spacing:.06em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin-top:12px;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:99px;background:linear-gradient(90deg,var(--lime) var(--p,0%),#2c3528 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid #0d0f0c;box-shadow:0 0 0 3px var(--lime),0 4px 12px #0008;margin-top:-10px}
input[type=range]::-moz-range-track{height:14px;border-radius:99px;background:#2c3528}
input[type=range]::-moz-range-progress{height:14px;border-radius:99px;background:var(--lime)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #0d0f0c}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--tx2);font-weight:700;padding:0 6px}
/* buttons */
.btn{display:block;width:100%;border:0;border-radius:18px;padding:17px;font-family:var(--disp);font-size:19px;background:var(--grad);color:#0d0f0c;cursor:pointer;box-shadow:0 5px 0 #0f6b3a,0 10px 30px rgba(166,255,77,.18);text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0f6b3a}
.btn.ghost{background:transparent;color:var(--tx);box-shadow:none;border:1.5px solid var(--line);font-family:"Zen Kaku Gothic New";font-weight:700;font-size:15px;padding:13px;margin-top:10px}
.btn.danger{background:transparent;color:var(--red);box-shadow:none;border:1.5px solid #5a2a30;font-family:"Zen Kaku Gothic New";font-weight:700;font-size:15px;padding:13px;margin-top:10px}

/* wizard */
.wiz{display:flex;flex-direction:column;min-height:calc(100vh - var(--safe-t) - var(--safe-b) - 190px)}
.wtop{display:flex;align-items:center;gap:12px;margin:14px 0 6px}
.back{width:40px;height:40px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:18px;font-weight:900;cursor:pointer;flex-shrink:0}
.back:empty{visibility:hidden}
.prog{flex:1;height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.prog div{height:100%;background:var(--grad);border-radius:99px;transition:width .3s}
.wcount{font-family:var(--disp);font-size:14px;color:var(--tx2);width:30px;text-align:right}
.wbody{flex:1}
.wbody.in-r{animation:inr .28s cubic-bezier(.2,.9,.3,1)}
.wbody.in-l{animation:inl .28s cubic-bezier(.2,.9,.3,1)}
@keyframes inr{from{transform:translateX(40px);opacity:0}}
@keyframes inl{from{transform:translateX(-40px);opacity:0}}
.wfoot{padding-top:14px}
.shead{margin:12px 0 16px}
.sjp{font-weight:900;color:var(--lime);letter-spacing:.14em;font-size:14px}
.stitle{font-family:var(--disp);font-size:34px;line-height:1.05;margin-top:2px}
.shint{font-size:12px;color:var(--tx2);font-weight:700;margin-top:6px;letter-spacing:.04em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tiles.one{grid-template-columns:1fr}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:13px 14px;text-align:left;cursor:pointer;transition:transform .12s,background .15s;min-height:58px}
.tile b{display:block;font-size:16px;font-weight:900}
.tile span{display:block;font-size:12px;color:var(--tx2);font-weight:700;margin-top:2px}
.tile.on{background:var(--lime);border-color:var(--lime);color:#0d0f0c;transform:scale(.97) rotate(-1deg)}
.tile.on span{color:#2a4a12}
.tile:active{transform:scale(.94)}
.chips.big .chip{font-size:15px;padding:10px 14px}
.meter.big{padding:22px 16px 22px}
.meter.big .war{width:120px;height:120px}
.meter.big .num{font-size:64px}
.btn:disabled{opacity:.35;box-shadow:none}
.summary{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.summary svg{width:56px;height:56px;background:var(--card2);border-radius:14px;flex-shrink:0}
.summary b{display:block;font-weight:900}
.summary span{font-family:var(--disp);color:var(--lime);font-size:14px}
/* ranking */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;font-size:13px;font-weight:700;padding:9px;border-radius:10px;color:var(--tx2);cursor:pointer}
.seg button.on{background:var(--lime);color:#0d0f0c}
.entry{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden}
.entry:active{transform:scale(.98)}
.entry.top1{background:linear-gradient(135deg,#2a3a16,#191e17 60%);border-color:#4d6b22}
.entry .av{width:58px;height:58px;flex-shrink:0;border-radius:16px;background:var(--card2)}
.entry .av svg{width:100%;height:100%}
.einfo{flex:1;min-width:0}
.etitle{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--lime);margin-bottom:2px}
.etitle.g{color:var(--gold)}
.ename{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emeta{font-size:12px;color:var(--tx2);margin-top:2px;font-weight:700}
.escore{font-family:var(--disp);font-size:26px;line-height:1;text-align:right}
.escore small{display:block;font-family:"Zen Kaku Gothic New";font-size:10px;font-weight:900;color:var(--tx2);letter-spacing:.08em;margin-top:3px}
.empty{text-align:center;padding:30px 10px;color:var(--tx2);font-weight:700}
.empty svg{width:120px;height:120px;display:block;margin:0 auto 8px}
/* stats */
.rankcard{background:var(--grad);color:#0d0f0c;border-radius:24px;padding:18px;position:relative;overflow:hidden}
.rankcard .lv{font-family:var(--disp);font-size:34px;line-height:1}
.rankcard .lvjp{font-weight:900;font-size:13px;letter-spacing:.14em;opacity:.7}
.rankcard .bar{height:12px;border-radius:99px;background:rgba(13,15,12,.2);margin-top:14px;overflow:hidden}
.rankcard .bar div{height:100%;background:#0d0f0c;border-radius:99px}
.rankcard .nx{font-size:12px;font-weight:900;margin-top:6px;opacity:.75}
.rankcard svg{position:absolute;right:-8px;top:-6px;width:110px;height:110px;transform:rotate(10deg)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat .v{font-family:var(--disp);font-size:28px;color:var(--lime);line-height:1.1;word-break:break-word}
.stat .l{font-size:12px;color:var(--tx2);font-weight:700;margin-top:3px}
.bars .b{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:8px 0}
.bars .b .n{width:96px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .b .t{flex:1;height:12px;background:var(--card2);border-radius:99px;overflow:hidden}
.bars .b .t div{height:100%;background:var(--grad);border-radius:99px}
.bars .b .s{width:34px;text-align:right;font-family:var(--disp)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;font-size:12px;font-weight:900}
.badge .e{font-size:30px;display:block;margin-bottom:4px}
.badge.off{opacity:.3;filter:grayscale(1)}
.badge small{display:block;color:var(--tx2);font-size:10px;margin-top:3px;line-height:1.3;font-weight:700}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:10px;font-weight:900;color:var(--tx2)}
.legend svg{width:100%;aspect-ratio:1;background:var(--card2);border-radius:14px;display:block;margin-bottom:4px}
/* omikuji */
.omi{text-align:center}
.omi .ninja{width:150px;height:150px;margin:6px auto 10px;display:block}
.omi .ninja.throw{animation:throw .9s ease-in-out}
@keyframes throw{20%{transform:rotate(-14deg) scale(.95)}45%{transform:rotate(10deg) scale(1.08) translateY(-10px)}70%{transform:rotate(-4deg)}}
.slip{background:#f3f7ee;color:#0d0f0c;border-radius:20px;padding:20px 16px;margin-top:16px;text-align:center;animation:pop .45s cubic-bezier(.2,1.5,.4,1);position:relative}
.slip .fortune{font-family:var(--disp);font-size:46px;color:#0d0f0c;line-height:1}
.slip .fde{font-size:12px;font-weight:900;letter-spacing:.12em;color:#1f8f50;margin:6px 0 12px}
.slip .tip{font-weight:700;line-height:1.5}
.slip .luck{font-size:12px;color:#55604f;margin-top:10px;font-weight:700}
.slip.bad{background:#2a1416;color:#ffd6da}.slip.bad .fortune{color:var(--red)}.slip.bad .fde{color:#ff8a95}.slip.bad .luck{color:#c79a9f}
@keyframes pop{from{transform:translateY(16px) scale(.9);opacity:0}to{transform:none;opacity:1}}
/* nav */
nav{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 10px);z-index:10;display:flex;justify-content:center}
nav .in{display:flex;max-width:520px;width:100%;background:rgba(25,30,23,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 10px 30px #000a}
nav button{flex:1;border:0;background:none;padding:7px 0 6px;color:var(--tx2);cursor:pointer;font-size:10px;font-weight:900;letter-spacing:.06em;border-radius:18px;transition:background .15s}
nav button b{display:block;font-family:var(--disp);font-weight:400;font-size:19px;margin-bottom:1px;color:var(--tx)}
nav button.on{background:var(--lime);color:#0d0f0c}
nav button.on b{color:#0d0f0c}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:20;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.reveal{position:fixed;inset:0;z-index:25;display:grid;place-items:center;overflow:hidden;animation:fade .1s}
.reveal .lines{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,var(--lc) 0deg 2.2deg,transparent 2.2deg 7deg);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(30deg)}}
.reveal .core{position:relative;text-align:center;animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:scale(2.6) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.reveal .core svg{width:200px;height:200px;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
.reveal .big{font-family:var(--disp);font-size:58px;line-height:1;-webkit-text-stroke:3px #0d0f0c;paint-order:stroke fill;transform:rotate(-5deg);margin-top:4px}
.reveal .sm{font-weight:900;letter-spacing:.14em;font-size:14px;margin-top:10px}
.reveal.shake .core{animation:slam .5s cubic-bezier(.2,1.6,.4,1),shk .35s .5s 2}
@keyframes shk{25%{transform:translate(-6px,2px) rotate(-2deg)}75%{transform:translate(6px,-2px) rotate(2deg)}}
.dialog{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;max-width:360px;width:100%;max-height:86vh;overflow:auto}
.dhead{display:flex;gap:14px;align-items:center}
.dhead svg{width:84px;height:84px;background:var(--card2);border-radius:20px;flex-shrink:0}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:16px 0;font-weight:700}
.dl dt{color:var(--tx2)}
.dl dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:900;z-index:30;animation:pop .3s;white-space:nowrap}
.status{font-size:11px;color:var(--tx2);text-align:center;margin-top:22px;font-weight:700}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9dff5c"/><stop offset="1" stop-color="#1fbf6a"/></linearGradient>
<linearGradient id="cupG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe7d8"/></linearGradient>
<g id="base"><path d="M24 38h52l-5 34c-1 8-8 13-17 13h-8c-9 0-16-5-17-13z" fill="url(#cupG)"/><ellipse cx="50" cy="38" rx="26" ry="5.5" fill="#2f9a4a"/></g>
</defs></svg>

<div class="wrap">
  <header>
    <div class="ava" id="hdrAva"></div>
    <div><div class="brand">Uma<em>cha</em></div><div class="tagline">旨茶 · KONBINI TEA DOJO</div></div>
  </header>
  <main id="app"></main>
  <div class="status" id="status"></div>
</div>
<nav><div class="in">
  <button data-v="new"><b>記</b>NEU</button>
  <button data-v="rank"><b>番付</b>RANKING</button>
  <button data-v="stats"><b>忍</b>DOJO</button>
  <button data-v="omikuji"><b>籤</b>ORAKEL</button>
</div></nav>
<div id="layer"></div>

let teas=[];
const LS="ocha-log-v1";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(teas))}catch(e){toast("Speichern fehlgeschlagen 😿")}}

  teas=lsLoad();
  try{ if(!localStorage.getItem("ocha-seeded")){
    if(!teas.length) teas.push({id:"t-lawson-mugicha",name:"Lawson Mugicha",store:"Lawson",type:"mugicha",rating:1.5,flavors:[],temp:"",price:"",again:"",note:"Der allererste Eintrag.",date:"2026-11-01",createdAt:1793534400000,updatedAt:1793534400000});
    localStorage.setItem("ocha-seeded","1"); lsSave(); } }catch(e){}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  document.getElementById("status").textContent="📱 Gespeichert auf deinem iPhone";
  render();
}
function saveTea(t){const i=teas.findIndex(x=>x.id===t.id); if(i>=0)teas[i]=t; else teas.push(t); lsSave();}
function deleteTea(id){teas=teas.filter(x=>x.id!==id); lsSave();}

// ---------- Backup ----------
async function exportBackup(){
  const json=JSON.stringify({app:"umacha",v:1,exported:new Date().toISOString(),teas},null,1);
  const name=`umacha-backup-${today()}.json`;
  const file=new File([json],name,{type:"application/json"});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Umacha Backup"}); return; } }catch(e){ if(e&&e.name==="AbortError")return; }
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);const list=Array.isArray(d)?d:d.teas;if(!Array.isArray(list))throw 0;
    let added=0;list.forEach(t=>{if(!t||!t.id||typeof t.rating!=="number")return;const i=teas.findIndex(x=>x.id===t.id);if(i>=0)teas[i]=t;else{teas.push(t);added++}});
    lsSave();render();toast(`Backup geladen – ${added} neue Tees 🥷`);}catch(e){toast("Das ist keine gültige Backup-Datei")}};
  r.readAsText(file);
}

// ---------- Neuer Eintrag ----------
function chips(list,sel,key,multi){
  return list.map(x=>{const id=Array.isArray(x)?x[0]:x;
    const label = key==="store"? id : (Array.isArray(x)?x[1]:x);
    const jp = key==="store"? x[1] : (Array.isArray(x)?x[2]||"":"");
    const on = multi? sel.includes(id) : sel===id;
    return `<button class="chip ${on?"on":""}" data-k="${key}" data-id="${esc(id)}">${esc(label)}${jp?`<span class="k">${jp}</span>`:""}</button>`}).join("");
}
function meterInner(r){
  const w=warrior(r);
  return `<div class="top"><div class="war" id="mWar">${svg(w.id)}</div>
    <div><div class="num">${r?fmtR(r):"–"}<small> /5</small></div>
    <div class="shout" style="color:${r?w.tc==="#fff"?"var(--lime)":w.tc:"var(--tx2)"}">${r?w.shout:"Wie war er?"}</div>
    <div class="who">${r?`${w.name.toUpperCase()} · ${w.jp}`:w.line}</div></div></div>`;
}
const STEPS=["store","type","rate","flavors","again","details"];
let step=0, stepDir=1;
function tiles(list,sel,key){
  return `<div class="tiles">${list.map(x=>{const id=x[0];const label=key==="store"?id:x[1];const jp=key==="store"?x[1]:x[2];
    return `<button class="tile ${sel===id?"on":""}" data-k="${key}" data-id="${esc(id)}"><b>${esc(label)}</b>${jp?`<span>${jp}</span>`:""}</button>`}).join("")}</div>`;
}
function stepHead(t,jp,hint){return `<div class="shead"><div class="sjp">${jp}</div><div class="stitle">${t}</div>${hint?`<div class="shint">${hint}</div>`:""}</div>`}
function viewNew(){
  const s=STEPS[step], pct=(step+1)/STEPS.length*100;
  let body="", next="";
  if(s==="store"){body=stepHead("Wo gekauft?","店","Tippen = weiter")+tiles(STORES,form.store,"store");}
  else if(s==="type"){body=stepHead("Welcher Tee?","種類","Tippen = weiter")+tiles(TYPES,form.type,"type");}
  else if(s==="rate"){body=stepHead("Wie war er?","評価","Schieb das Uma-Meter")+`
    <div class="meter big"><div id="meterIn">${meterInner(form.rating)}</div>
      <input type="range" id="rate" min="0" max="10" step="1" value="${form.rating*2}" style="--p:${form.rating/5*100}%">
      <div class="ticks"><span>👹</span><span>🎭</span><span>👒</span><span>⚔️</span><span>👑</span></div></div>`;
    next=`<button class="btn" id="next" ${form.rating?"":"disabled"}>Weiter →</button>`;}
  else if(s==="flavors"){body=stepHead("Wie schmeckt er?","味","Mehrere möglich")+`<div class="chips big">${chips(FLAVORS,form.flavors,"flavors",true)}</div>`;
    next=`<button class="btn" id="next">${form.flavors.length?"Weiter →":"Überspringen →"}</button>`;}
  else if(s==="again"){body=stepHead("Nochmal kaufen?","また買う？","")+tiles(AGAIN.map(a=>[a[0],a[1],""]),form.again,"again").replace('class="tiles"','class="tiles one"')+
    `<div class="label" style="margin-top:18px"><b>Temperatur</b><span>温度</span></div><div class="chips">${chips(TEMPS,form.temp,"temp")}</div>`;
    next=`<button class="btn" id="next">Weiter →</button>`;}
  else {body=stepHead("Noch was?","詳細","Alles optional")+`
    <div class="field row2">
      <div><div class="label"><b>Name</b></div><input type="text" id="f-name" placeholder="z.B. Oi Ocha" value="${esc(form.name)}"></div>
      <div><div class="label"><b>Preis ¥</b></div><input type="number" inputmode="numeric" id="f-price" placeholder="138" value="${esc(form.price)}"></div></div>
    <div class="field"><div class="label"><b>Notiz</b></div><textarea id="f-note" placeholder="Ein Satz reicht. Oder gar keiner.">${esc(form.note)}</textarea></div>
    <div class="summary">${svg(warrior(form.rating).id)}<div><b>${esc(form.name||((form.store?form.store+" ":"")+typeName(form.type)))}</b><span>${fmtR(form.rating)} · ${warrior(form.rating).shout}</span></div></div>`;
    next=`<button class="btn" id="save">斬 BEWERTEN!</button>${form.id?`<button class="btn danger" id="del">Eintrag löschen</button>`:""}`;}
  return `<div class="wiz">
    <div class="wtop"><button class="back" id="back">${step===0?(form.id?"✕":""):"←"}</button>
      <div class="prog"><div style="width:${pct}%"></div></div><div class="wcount">${step+1}/${STEPS.length}</div></div>
    <div class="wbody ${stepDir>0?"in-r":"in-l"}">${body}</div>
    <div class="wfoot">${next}</div></div>`;
}
function goStep(n){stepDir=n>step?1:-1;step=Math.max(0,Math.min(STEPS.length-1,n));render();window.scrollTo(0,0);}
function bindNew(){
  document.querySelectorAll(".tile").forEach(c=>c.onclick=()=>{
    const k=c.dataset.k,id=c.dataset.id; buzz(8); form[k]=id;
    c.parentNode.querySelectorAll(".tile").forEach(x=>x.classList.toggle("on",x===c));
    if(k!=="again") setTimeout(()=>goStep(step+1),180);
  });
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    const k=c.dataset.k,id=c.dataset.id; buzz(5);
    if(k==="flavors"){form.flavors=form.flavors.includes(id)?form.flavors.filter(f=>f!==id):[...form.flavors,id];c.classList.toggle("on");
      const n=document.getElementById("next"); if(n)n.textContent=form.flavors.length?"Weiter →":"Überspringen →";}
    else{form[k]=form[k]===id?"":id; c.parentNode.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c&&form[k]===id));}
  });
  const back=document.getElementById("back");
  back.onclick=()=>{ if(step>0)goStep(step-1); else if(form.id){form=blank();go("rank");} };
  const rate=document.getElementById("rate");
  if(rate)rate.oninput=()=>{const v=+rate.value/2; const prevW=warrior(form.rating).id; form.rating=v;
    rate.style.setProperty("--p",(v/5*100)+"%");
    document.getElementById("meterIn").innerHTML=meterInner(v);
    document.getElementById("next").disabled=!v;
    if(warrior(v).id!==prevW){document.getElementById("mWar").classList.add("bump");buzz(15);} else buzz(4);
  };
  const nx=document.getElementById("next"); if(nx)nx.onclick=()=>goStep(step+1);
  ["name","price","note"].forEach(k=>{const el=document.getElementById("f-"+k);if(el)el.oninput=()=>form[k]=el.value;});
  const sv=document.getElementById("save"); if(sv)sv.onclick=()=>{
    if(!form.type){toast("Welcher Tee war's? 🍵");goStep(1);return}
    if(!form.rating){toast("Erst das Uma-Meter schieben 👆");goStep(2);return}
    const t={...form,id:form.id||("t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),price:form.price===""?"":Number(form.price),name:form.name.trim(),note:form.note.trim(),updatedAt:Date.now()};
    if(!form.id)t.createdAt=Date.now();
    saveTea(t);
    reveal(t.rating,()=>{form=blank();step=0;view="rank";render();window.scrollTo(0,0)});
  };
  const d=document.getElementById("del"); if(d)d.onclick=()=>confirmBox("Diesen Tee wirklich löschen?",()=>{deleteTea(form.id);form=blank();step=0;go("rank");toast("Weg damit 🥷💨")});
}

// ---------- Ranking (番付) ----------
const TITLES=[["YOKOZUNA","横綱"],["ŌZEKI","大関"],["SEKIWAKE","関脇"],["KOMUSUBI","小結"]];
function displayName(t){return t.name||`${t.store?t.store+" ":""}${typeName(t.type)}`}
function viewRank(){
  const types=["alle",...new Set(teas.map(t=>t.type))];
  let list=teas.filter(t=>rankFilter==="alle"||t.type===rankFilter);
  list.sort(rankSort==="rating"?(a,b)=>b.rating-a.rating||(b.createdAt||0)-(a.createdAt||0):(a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
  const items=list.map((t,i)=>{const w=warrior(t.rating);
    const title=rankSort==="rating"?(TITLES[i]?`${TITLES[i][0]} ${TITLES[i][1]}`:`MAEGASHIRA 前頭 #${i-3}`):fmtDate(t.date);
    return `<div class="entry ${rankSort==="rating"&&i===0?"top1":""}" data-id="${t.id}">
      <div class="av">${svg(w.id)}</div>
      <div class="einfo"><div class="etitle ${rankSort==="rating"&&i===0?"g":""}">${title}</div>
        <div class="ename">${esc(displayName(t))}</div>
        <div class="emeta">${typeJp(t.type)} · ${esc(t.store||"?")}${t.price!==""&&t.price!=null?` · ¥${esc(t.price)}`:""}</div></div>
      <div class="escore" style="color:${w.tc==="#fff"?"var(--lime)":w.tc}">${fmtR(t.rating)}<small>${w.shout}</small></div>
    </div>`}).join("");
  return `
  <h2>Banzuke <span class="jp">番付 · RANGLISTE</span></h2>
  <div class="seg"><button data-s="rating" class="${rankSort==="rating"?"on":""}">Nach Bewertung</button><button data-s="date" class="${rankSort==="date"?"on":""}">Neueste zuerst</button></div>
  ${types.length>2?`<div class="chips" style="margin-bottom:14px">${types.map(t=>`<button class="chip ${rankFilter===t?"on":""}" data-f="${esc(t)}">${t==="alle"?"Alle":esc(typeName(t))}</button>`).join("")}</div>`:""}
  ${items||`<div class="empty">${svg("ninja")}Noch keine Tees.<br>Ab in den Konbini, Ninja!</div>`}`;
}
function bindRank(){
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{rankSort=b.dataset.s;render()});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{rankFilter=b.dataset.f;render()});
  document.querySelectorAll(".entry").forEach(e=>e.onclick=()=>showDetail(teas.find(t=>t.id===e.dataset.id)));
}
function showDetail(t){
  if(!t)return;const w=warrior(t.rating);const ag=(AGAIN.find(a=>a[0]===t.again)||[,"–"])[1];const tp=(TEMPS.find(a=>a[0]===t.temp)||[,"–"])[1];
  overlay(`<div class="dialog">
    <div class="dhead">${svg(w.id)}<div><div style="font-family:var(--disp);font-size:20px;line-height:1.15">${esc(displayName(t))}</div>
      <div style="font-family:var(--disp);font-size:30px;color:${w.tc==="#fff"?"var(--lime)":w.tc};margin-top:4px">${fmtR(t.rating)} <span style="font-size:16px">${w.shout}</span></div>
      <div class="sub">${w.name} · ${w.line}</div></div></div>
    <dl class="dl"><dt>Sorte</dt><dd>${esc(typeName(t.type))} ${typeJp(t.type)}</dd><dt>Laden</dt><dd>${esc(t.store||"–")}</dd><dt>Datum</dt><dd>${fmtDate(t.date)}</dd>
    <dt>Preis</dt><dd>${t.price!==""&&t.price!=null?"¥"+esc(t.price):"–"}</dd><dt>Temp.</dt><dd>${tp}</dd><dt>Nochmal?</dt><dd>${ag}</dd>
    ${t.flavors&&t.flavors.length?`<dt>Geschmack</dt><dd>${t.flavors.map(esc).join(", ")}</dd>`:""}
    ${t.note?`<dt>Notiz</dt><dd>${esc(t.note)}</dd>`:""}</dl>
    <button class="btn" id="d-edit">Bearbeiten</button><button class="btn ghost" id="d-close">Schließen</button></div>`);
  document.getElementById("d-close").onclick=closeOverlay;
  document.getElementById("d-edit").onclick=()=>{form={...blank(),...t,flavors:[...(t.flavors||[])],price:t.price??""};closeOverlay();step=0;stepDir=1;go("new")};
}

// ---------- Dojo (Stats) ----------
const LEVELS=[[0,"GENIN","下忍","Ninja-Azubi"],[5,"CHŪNIN","中忍","Mittlerer Ninja"],[15,"JŌNIN","上忍","Elite-Ninja"],[30,"KAGE","影","Schatten-Meister"],[60,"LEGENDE","伝説","Tee-Legende"]];
function viewStats(){
  const n=teas.length;const avg=n?teas.reduce((s,t)=>s+t.rating,0)/n:0;
  const spent=teas.reduce((s,t)=>s+(Number(t.price)||0),0);
  let li=0;LEVELS.forEach((l,i)=>{if(n>=l[0])li=i});const L=LEVELS[li],N=LEVELS[li+1];
  const pct=N?((n-L[0])/(N[0]-L[0]))*100:100;
  const group=key=>{const m={};teas.forEach(t=>{const k=t[key];if(!k)return;(m[k]=m[k]||[]).push(t.rating)});
    return Object.entries(m).map(([k,a])=>[k,a.reduce((x,y)=>x+y,0)/a.length,a.length]).sort((a,b)=>b[1]-a[1])};
  const byStore=group("store"),byType=group("type");
  const fl={};teas.forEach(t=>(t.flavors||[]).forEach(f=>fl[f]=(fl[f]||0)+1));const topFl=Object.entries(fl).sort((a,b)=>b[1]-a[1])[0];
  const cnt={};teas.forEach(t=>{const id=warrior(t.rating).id;cnt[id]=(cnt[id]||0)+1});
  const big4=["7-Eleven","FamilyMart","Lawson","Ministop"];
  const B=[
    ["🥷","Erster Schluck","1 Tee bewertet",n>=1],
    ["🏪","Konbini-Kenner","Alle 4 großen Konbinis",big4.every(s=>teas.some(t=>t.store===s))],
    ["👹","Dämonenjäger","Einen Oni besiegt (unter 2)",teas.some(t=>t.rating<2)],
    ["👑","Yokozuna-Finder","Eine glatte 5 vergeben",teas.some(t=>t.rating>=5)],
    ["🌈","Sortenvielfalt","5 verschiedene Sorten",new Set(teas.map(t=>t.type)).size>=5],
    ["🤖","Automaten-Jäger","3 Tees aus dem 自販機",teas.filter(t=>t.store==="Automat").length>=3],
    ["📦","Pappkarton-Sommelier","„nach Pappe“ geschmeckt",teas.some(t=>(t.flavors||[]).includes("nach Pappe 📦"))],
    ["♨️","Winterseele","3 warme Tees",teas.filter(t=>t.temp==="warm").length>=3],
    ["💴","Großinvestor","¥1.000 für Tee",spent>=1000],
  ];
  const bars=(arr,lab)=>arr.length?arr.slice(0,6).map(([k,a])=>`<div class="b"><div class="n">${esc(lab(k))}</div><div class="t"><div style="width:${a/5*100}%"></div></div><div class="s">${fmtR(a)}</div></div>`).join(""):`<div class="sub">Noch keine Daten</div>`;
  return `
  <h2>Dein Dojo <span class="jp">道場</span></h2>
  <div class="rankcard">${svg("ninja")}
    <div class="lvjp">${L[2]} · RANG</div><div class="lv">${L[1]}</div><div style="font-weight:900;font-size:13px">${L[3]}</div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="nx">${N?`Noch ${N[0]-n} Tee${N[0]-n===1?"":"s"} bis ${N[1]}`:"Höchster Rang erreicht. Respekt. 🙇"}</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="v">${n}</div><div class="l">Tees probiert</div></div>
    <div class="stat"><div class="v">${n?fmtR(avg):"–"}</div><div class="l">Ø Bewertung</div></div>
    <div class="stat"><div class="v">¥${spent.toLocaleString("de-DE")}</div><div class="l">für Tee ausgegeben</div></div>
    <div class="stat"><div class="v" style="font-size:18px">${topFl?esc(topFl[0]):"–"}</div><div class="l">häufigster Geschmack</div></div>
  </div>
  <h3>Deine Gegner</h3>
  <div class="legend">${["oni","kabuki","ronin","samurai","sumo"].map(id=>{const w=warrior({oni:1,kabuki:2,ronin:3,samurai:4,sumo:5}[id]);return `<div>${svg(id)}${w.name}<br><span style="color:var(--lime);font-family:var(--disp);font-size:14px">${cnt[id]||0}×</span></div>`}).join("")}</div>
  <h3>Läden im Vergleich</h3><div class="card bars">${bars(byStore,k=>k)}</div>
  <h3>Sorten im Vergleich</h3><div class="card bars">${bars(byType,typeName)}</div>
  <h3>Abzeichen</h3>
  <div class="badges">${B.map(b=>`<div class="badge ${b[3]?"":"off"}"><span class="e">${b[0]}</span>${b[1]}<small>${b[2]}</small></div>`).join("")}</div>
  <h3>Backup</h3>
  <div class="card"><div class="sub" style="margin-bottom:12px">Deine Tees liegen nur auf diesem iPhone. Sichere ab und zu ein Backup (z.B. in „Dateien“ oder per Mail an dich).</div>
    <button class="btn" id="exp">💾 Backup sichern</button>
    <label class="btn ghost">📂 Backup laden<input type="file" id="imp" accept=".json,application/json" style="display:none"></label></div>`;
}
function bindStats(){document.getElementById("exp").onclick=exportBackup;document.getElementById("imp").onchange=e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value=""};}

// ---------- Orakel ----------
const FORTUNES=[["大吉","DAIKICHI","Großes Glück"],["中吉","CHŪKICHI","Mittleres Glück"],["小吉","SHŌKICHI","Kleines Glück"],["吉","KICHI","Glück"],["末吉","SUEKICHI","Glück kommt noch"],["凶","KYŌ","Pech – trink lieber Wasser"]];
function drawOmikuji(){
  const tried=new Set(teas.map(t=>t.type));const untried=TYPES.filter(t=>t[0]!=="andere"&&!tried.has(t[0]));
  const f=FORTUNES[Math.floor(Math.random()*FORTUNES.length)];
  const stores=STORES.slice(0,6).map(s=>s[0]);const store=stores[Math.floor(Math.random()*stores.length)];
  const good=teas.filter(t=>t.rating>=4);
  let tip;
  if(f[0]==="凶") tip=`Der Ninja hat Böses gesehen: Meide heute <b>${esc(store)}</b>. Und alles mit „Mugi“ im Namen.`;
  else if(untried.length&&Math.random()<.65){const u=untried[Math.floor(Math.random()*untried.length)];tip=`Deine Mission: <b>${u[1]} ${u[2]}</b>. Einsatzort: <b>${esc(store)}</b>. Lautlos rein, Tee raus.`}
  else if(good.length){const g=good[Math.floor(Math.random()*good.length)];tip=`Hol dir nochmal <b>${esc(displayName(g))}</b> (${fmtR(g.rating)}). Ein Samurai kehrt zurück.`}
  else {const u=TYPES[Math.floor(Math.random()*(TYPES.length-1))];tip=`Heute ist ein guter Tag für <b>${u[1]} ${u[2]}</b>. Einsatzort: <b>${esc(store)}</b>.`}
  const lucky=["Glücksfarbe: Neon-Lime","Glückszahl: 138 Yen","Glücksrichtung: Kühlregal links unten","Glücksort: der Automat vor dem Bahnhof","Glücksbegleiter: ein Onigiri","Glückszeit: kurz vor Mitternacht","Glückswaffe: ein Strohhalm"];
  omikuji={f,tip,lucky:lucky[Math.floor(Math.random()*lucky.length)]};
}
function viewOmikuji(){
  return `
  <h2>Ninja-Orakel <span class="jp">おみくじ</span></h2>
  <div class="card omi">
    <div class="sub">Welcher Tee heute? Der Ninja wirft ein Los.</div>
    <div class="ninja" id="ninja">${svg("ninja",true).replace("<svg","<svg style='border-radius:36px'")}</div>
    <button class="btn" id="draw">🥷 Los werfen!</button>
    ${omikuji?`<div class="slip ${omikuji.f[0]==="凶"?"bad":""}"><div class="fortune">${omikuji.f[0]}</div><div class="fde">${omikuji.f[1]} · ${omikuji.f[2]}</div><div class="tip">${omikuji.tip}</div><div class="luck">${omikuji.lucky}</div></div>`:""}
  </div>`;
}
function bindOmikuji(){
  document.getElementById("draw").onclick=()=>{const n=document.getElementById("ninja");n.classList.remove("throw");void n.offsetWidth;n.classList.add("throw");buzz([10,60,20]);
    setTimeout(()=>{drawOmikuji();render()},900)};
}

// ---------- Overlays ----------
function overlay(html){const l=document.getElementById("layer");l.innerHTML=`<div class="overlay" id="ov">${html}</div>`;
  document.getElementById("ov").onclick=e=>{if(e.target.id==="ov")closeOverlay()};}
function closeOverlay(){document.getElementById("layer").innerHTML=""}
function reveal(r,done){
  const w=warrior(r);const l=document.getElementById("layer");
  const big=r>=4;
  l.innerHTML=`<div class="reveal ${r<2||r>=5?"shake":""}" id="rv" style="background:${w.bg};--lc:${w.lc}"><div class="lines"></div>
    <div class="core">${svg(w.id)}<div class="big" style="color:${w.tc}">${w.shout}</div>
    <div class="sm" style="color:${big?"#0d0f0c":"var(--tx2)"}">${w.name.toUpperCase()} · ${w.jp} · ${fmtR(r)}</div></div></div>`;
  buzz(r>=5?[30,50,30,50,80]:r<2?[80,40,80]:[25,40,25]);
  let closed=false;const fin=()=>{if(closed)return;closed=true;l.innerHTML="";done&&done()};
  document.getElementById("rv").onclick=fin; setTimeout(fin,1900);
}
function confirmBox(msg,yes){overlay(`<div class="dialog" style="text-align:center">${svg("oni")}<p style="font-weight:900;margin:6px 0 16px">${esc(msg)}</p><button class="btn" id="c-yes" style="background:var(--red);box-shadow:0 5px 0 #8a1f2a;color:#fff">Ja, löschen</button><button class="btn ghost" id="c-no">Abbrechen</button></div>`);
  document.querySelector(".dialog svg").style.cssText="width:90px;height:90px";
  document.getElementById("c-yes").onclick=()=>{closeOverlay();yes()};document.getElementById("c-no").onclick=closeOverlay;}
let tt;function toast(m){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),2200)}

initStore();
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;if(view!=='new'||step===0)location.reload()});});
</script>
</body>
</html>
